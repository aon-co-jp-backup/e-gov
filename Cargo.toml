[package]
name = "e-gov-server"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "e-gov-server"
path = "src/main.rs"

[dependencies]
sonic-rs = "0.5"
poem = "3.1"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rust-json = { git = "https://github.com/aon-co-jp/RS-JSON" }
tracing = "0.1"
tracing-subscriber = "0.3"
reqwest = { version = "0.13", features = ["json", "rustls"], default-features = false }
anyhow = "1"
hmac = "0.13"
sha2 = "0.11"
base64 = "0.23"
pulldown-cmark = "0.13"
once_cell = "1"
